# 노드 파라미터 — 숫자는 초기값, 테스트 트랙 단계에서 보정 (functional_design.md 10절)
# use_fake_hw 는 launch 인자로 덮어쓴다 (s0_hw.launch.py use_fake_hw:=true)

motor_node:
  ros__parameters:
    duty_max: 0.75              # TT 모터 보호 (7.4V 배터리)
    pwm_hz: 1000
    wheel_map: [front_left, front_right, rear_left, rear_right]   # L1~L4가 어느 바퀴인지 — 2026-10-29 S0 확정
    invert: [true, false, true, false]                            # L1~L4 극성 반전 — 2026-10-29 S0: 양수에서 L1·L3(왼쪽) 뒤로 돎
    turn_gain: 1.0
    watchdog_s: 0.5
    gpio_chip: -1               # -1 = RP1 칩 자동 탐색

pantilt_node:
  ros__parameters:
    pan_channel: 0              # 2026-10-26 확인
    tilt_channel: 1
    settle_s: 0.3
    poses:                      # [팬, 틸트] 도 — 2026-10-29 S0: 팬 65 = 정면, 틸트는 클수록 위 (150 전방 아래, 180 전방)
      LINE: [70, 130]           # 2026-10-30 S1: 라인이 잘 보이는 각도 (사용자)
      JUNCTION: [65, 165]       # 초기값 — 분기점 마커가 보이는 각도로 S5에서 보정
      SIGN: [65, 180]
    cal_file: ~/.agv/pantilt_cal.json   # 앱 "정면 자동 맞춤" 결과 — 있으면 모든 자세의 팬 = 정면값 (틸트는 위 값). 앱 "초기화"로 지움
    i2c_bus: 1
    address: 64                 # 0x40
    oe_pin: 17                  # 제어 없이 동작 확인, 시작 시 LOW만 출력 (-1 = 사용 안 함)
    gpio_chip: -1

ultrasonic_node:
  ros__parameters:
    rate_hz: 15.0
    median_window: 5
    min_range: 0.02
    max_range: 2.0
    trig_pin: 5
    echo_pin: 6
    fake_distance: 1.0
    gpio_chip: -1

led_node:
  ros__parameters:
    red_pin: 16
    green_pin: 26
    gpio_chip: -1

segment_node:
  ros__parameters:
    pins: [4, 27, 12, 13, 9, 10, 11]   # a~g (pinmap.md, 2026-11-02) — 세그먼트마다 330Ω
    common_anode: false         # 부품이 공통 애노드(공통 단자 → 3.3V)면 true
    gpio_chip: -1

line_node:
  ros__parameters:
    enabled: true
    roi_ratio: 0.33             # 아래쪽 1/3 — 띠 3개(먼·중간·가까운)로 나눔
    black_ratio: 0.72           # 줄의 바닥 밝기(상위 10%)의 이 비율 이하 = 어두움 — 라인을 잃으면 ↑, 바닥 무늬가 잡히면 ↓
    black_v_max: 170            # 이보다 밝으면 라인 아님
    black_blur: 5               # 밝기 중앙값 필터 (홀수)
    black_s_max: 90             # 채도가 이보다 크면 색 마커 → 라인 아님
    min_pixels: 60
    column_fill: 0.4
    edge_ratio: 0.05
    ahead_center_ratio: 0.4
    default_line_px: 20
    angle_min_rows: 15          # 라인 각도를 믿으려면 따라간 줄이 이만큼 필요
    max_line_px: 45            # 한 줄에서 이보다 넓은 검은 구간은 라인 아님 (두꺼운 물체) — 실제 라인 굵기(px) 보고 조정
    center_weight_min: 0.3      # 라인 고르기: 가운데 1.0 → 양끝 0.3 (주변 어두운 물체 대신 가운데 라인)
    prev_weight_min: 0.5        # 직전 라인 위치에서 멀수록 낮춤
    bottom_bonus: 1.5           # 화면 맨 아래(차량 바로 앞)에 닿는 덩어리 가산
    confirm_frames: 3           # S1~S3에서 사진·주행으로 보정
    line_end_frames: 10         # 라인 끝만 더 오래 확인 (잠깐 놓친 것을 끝으로 보지 않게) — 진짜 끝에서 너무 늦게 서면 낮춤
    # 옆 갈래 (마커 앞 회전 판단 — 스티커 쪽에 갈래가 없으면 직진, 2026-11-06)
    branch_top_ratio: 0.2       # 화면 위 20% 아래부터 끝까지 봄 (분기점이 관심 영역보다 멂)
    branch_reach: 0.2           # 라인 중심에서 화면 폭 20%(64px) 이상 옆으로 뻗어야 갈래
    branch_rows: 3              # 그런 줄이 3줄 이상
    sticker_as_line: true       # 라인 위 색 스티커를 라인으로 (마커를 테이프 위에 붙임, 2026-11-06) — 끄면 스티커 자리에 라인 구멍
    sticker_s_min: 100          # 색 스티커 = 채도 100 이상·밝기 80 이상
    sticker_v_min: 80
    # 정지선 판정 (같은 노드, 검정 추출·확인 프레임은 위 값을 함께 씀)
    stop_roi_ratio: 0.5         # 아래 1/2 (y120~) — 라인보다 넓게, 일찍 잡아 지나쳐 멈춰도 영역 안
    stop_width_ratio: [3.0, 12.0]   # 정지선 가로 폭 = 라인 굵기의 3~12배 (트랙 규격 4~5배)
    stop_min_thickness: 0.65    # 세로 두께 ≥ 라인 굵기 × 0.65 — 같은 테이프 실측 0.76~0.79배, 얇은 바닥 선 제외
    stop_max_tilt_deg: 35.0     # 이보다 기울면 정지선 아님
    stop_gap_cols: 3            # 테이프 반사로 이만큼 끊겨도 이어진 것으로 봄
    stop_hold_frames: 20        # 판정 후 이 프레임 동안 아래로 나가는 정지선도 인정

marker_node:
  ros__parameters:
    # [H 시작, H 끝, S 최소, V 최소] (시작 > 끝이면 0을 넘어감) — 2026-11-02 책상 위 스티커 사진 기준, 트랙에서 다시 확인
    red: [168, 10, 125, 125]
    yellow: [24, 38, 120, 120]
    green: [60, 85, 90, 70]
    blue: [100, 116, 120, 90]
    min_area: 30                # 먼 스티커 약 57px
    min_fill: 0.5               # 면적 ÷ 외접 사각형
    width_ratio: [0.5, 1.6]     # 가로 폭 ÷ 예상 지름 (지름 2cm 스티커 기준)
    # 라인 위 마커 (2026-11-06): 스티커 아래(차 쪽)에 검은 라인이 이어지면 center(앞 라인 위 = 직진), 아니면 갈래 위 좌우
    below_from: 0.8             # 아래 검사 창: 스티커 중심에서 지름 × 0.8 ~ 1.8 아래
    below_to: 1.8
    below_half_width: 0.3       # 좌우 ± 지름 × 0.3
    below_black: 0.5            # 창의 50% 이상 검정이면 center
    center_ratio: 1.0           # 창이 화면 밖(바로 앞)이면 라인 위치에서 지름 안 = center

drive_node:
  ros__parameters:
    rate_hz: 20.0
    speed: 0.6                  # 기본 선속도 (-1~1). TT 모터는 낮으면 바닥에서 안 움직임 — S1에서 보정
    min_speed: 0.45             # 감속해도 이 아래로는 안 내림 (모터 시동 문턱)
    slow_gain: 0.5              # 선속도 = speed × (1 − slow_gain × |오프셋|)
    event_speed: 0.45           # 이벤트 판정이 보이기 시작하면 감속
    kp: 0.8                     # 회전 = −(kp·오프셋 + kd·변화율), 라인이 오른쪽(+)이면 오른쪽으로
    ki: 0.0
    kd: 0.15
    kh: 0.5                     # 라인 각도 보정 비율 (각도 오차 45°일 때 회전 0.5)
    heading_deadband_deg: 5.0   # 85~95°는 각도 보정 안 함
    turn_scale: 1.0             # 회전 세기 (회전량 전체에 곱함) — 앱 "회전 세기", 흔들리면 낮춤
    center_offset: -0.10        # 라인 기준 위치 — 카메라가 차체 중심에서 왼쪽에 달려 화면 가운데에서 10% 왼쪽 (2026-10-30 S1)
    max_angular: 0.6
    line_timeout_s: 0.5         # 라인 상태가 끊기면 정지 (E_LINE)
    recheck_tries: 3            # LINE_END 후 정지해서 라인을 다시 보는 횟수 (0이면 바로 끝)
    recheck_s: 0.5              # 한 번 보는 시간
    recheck_frames: 3           # 이만큼 연속 보이면 자동으로 다시 출발
    verify_clear_frames: 5      # 정지선·코너 판정 후 멈춰서 확인 — 판정이 이만큼 연속 사라지면 다시 출발
    verify_timeout_s: 2.0       # 확정도 사라짐도 없으면 이 시간 뒤 다시 출발
    verify_cooldown_s: 0.5      # 다시 출발 후 이 시간은 판정으로 멈추지 않음
    # 마커 — 목적지 색(/drive/target)이 정해졌을 때만 동작. 숫자는 초기값, 트랙에서 보정
    marker_slow_y: 60.0         # 스티커가 이 높이 아래로 보이면 감속
    marker_stop_y: 120.0        # 이 높이까지 내려오면 정지해서 좌우 확정 (양쪽이 함께 보이면 멈추지 않고 직진)
    marker_check_y: 90.0        # 확정할 때 이 높이 아래의 스티커만 봄 (건너편 마커 제외)
    marker_check_frames: 5      # 이만큼 보고 과반으로 좌우 확정
    marker_settle_s: 0.3        # 멈춘 뒤 흔들림이 가라앉을 때까지 기다림
    marker_check_timeout_s: 1.5 # 영상이 모자라도 이 시간이면 판단
    marker_branch_check: true   # 한쪽 스티커라도 그쪽에 라인 갈래가 안 보이면 직진 (false = 스티커만 보고 회전)
    marker_ignore_s: 2.0        # 직진·회전 뒤 이 시간은 마커 무시 (같은 마커 재인식 방지)
    turn_forward_s: 0.7         # 회전 전 전진 시간 — 회전 중심을 분기점 가까이 (앱 "회전 전 전진"). 짧으면 갈래 라인을 못 만남
    turn_speed: 0.6             # 제자리 회전 세기 (앱 "제자리 회전") — 약하면 안 돌고, 강하면 지나침
    turn_blind_s: 2.0           # 마커 회전 시작 후 이 시간은 라인을 보지 않고 돌기만 함 (앱 "회전 중 라인 무시", 0 = 끄기)
                                #   끝나면 바로 새 라인 찾기 — 이 시간에 90°를 넘게 돌면 줄임
    turn_min_s: 0.3             # 회전 시작 후 이 시간은 새 라인으로 인정 안 함
    turn_clear_frames: 2        # 기존 라인이 이만큼 연속 안 보이면 새 라인을 찾기 시작
    turn_jump_offset: 0.25      # 또는 오프셋이 도는 쪽으로 이만큼 튀면 (새 라인이 화면에 들어옴)
    turn_accept_offset: 0.4     # 새 라인 인정: 기준 위치에서 이만큼 안쪽
    turn_accept_deg: 35.0       # 새 라인 인정: 90° ± 이 각도 (T자 가로선 제외)
    turn_seen_frames: 3         # 새 라인이 이만큼 연속 보이면 회전 끝
    turn_timeout_s: 4.0         # 이 시간 안에 못 찾으면 정지·E_LINE (라인 무시가 끝난 뒤부터) — 실제 회전 속도를 보고 90°보다 조금 더 도는 시간으로 줄임
    turn_settle_s: 1.0          # 회전 후 이 시간은 정지선·코너·라인 끝을 무시 (분기점 가로선 재검출 방지)
    # 유턴 — 앱 "제자리 회전" 세기를 함께 씀
    uturn_min_s: 1.5            # 시작 후 이 시간은 새 라인으로 인정 안 함 — 실제 회전 속도에 맞춰 90°보다 조금 더 도는 시간으로
    uturn_timeout_s: 8.0        # 이 시간 안에 라인을 못 찾으면 정지·E_TURN
    # 유턴 후 맞추기 — 라인을 찾은 뒤 천천히 돌려 라인을 화면 기준 위치(앱 "라인 기준")에 맞추고 끝냄
    #   (빠르게 돌다 멈추면 관성·영상 지연으로 라인이 화면 끝에 남아 다음 출발에서 놓침)
    uturn_align: true           # false = 찾자마자 끝 (이전 방식)
    # 표지판 접근 (정지선 → 카메라 올림 → 직진 서행, mission_node가 초음파로 멈춤)
    approach_speed: 0.35        # 접근 속도 (앱 "접근 속도") — 안 움직이면 올림
    approach_kick_s: 0.3        # 출발 시동 시간 — 이 동안은 아래 세기로 (멈춘 TT 모터가 낮은 값으로는 안 돎)
    approach_kick_speed: 0.45
    # 초음파 정지 — 라인 주행 중 가까운 물체에서 멈춤 (결과 OBSTACLE). 제자리 회전·유턴·표지판 접근은 제외
    obstacle_stop: true
    obstacle_distance: 0.18     # m 이하가
    obstacle_hits: 3            # 연속 이만큼이면 정지
    align_tol: 0.1              # 기준 위치에서 이만큼 안이면 맞음
    align_frames: 2             # 멈춘 채 이만큼 연속 맞으면 끝
    align_gain: 1.0             # 회전 = 오차 × gain (아래 범위로 자름)
    align_min: 0.3              # 최소 회전 세기 — 안 돌면 올림
    align_max: 0.45             # 최대 회전 세기 — 다시 지나치면 내림
    align_timeout_s: 3.0        # 못 맞춰도 이 시간 뒤 끝 (UTURN_DONE)

classifier_node:
  ros__parameters:
    # 모델 = Teachable Machine에서 내보낸 파일을 agv_bringup/models/에 넣고 colcon build (이름만 적으면 설치 폴더 models/에서 찾음)
    sign_model: model_unquant.tflite
    sign_labels: labels.txt
    # 모델 클래스 이름 → 표지판 (대소문자 무시). 표지판 = sign_work(상차)·sign_drop_a(원 하차)·sign_drop_b(사각 하차)·sign_park(대기장소)·background
    label_map: ["LOAD:sign_work", "BOTTLE:sign_drop_a", "BOX:sign_drop_b", "HOME:sign_park", "none:background"]
    frames: 5                   # 요청마다 새 영상 이만큼 추론
    need: 3                     # 같은 라벨이 이만큼 이상이면 확정
    min_score: 0.8
    timeout_s: 3.0

mission_node:
  ros__parameters:
    sign_distance: 0.18         # 표지판 앞 정지 거리(m) — 변경 시나리오 "약 18cm", S6에서 보정
    sign_hits: 3                # 이만큼 연속 가까우면 정지
    approach_timeout_s: 10.0    # 정지선 → 표지판 앞 시간 제한 (E_APPROACH)
    item_interval_s: 1.0        # 상차·하차 1개 간격
    obstacle_enabled: false     # 변경 시나리오: 장애물 없음 (켜면 주행 중 가까운 물체에서 멈춤)
    obstacle_distance: 0.18     # 주행 중 장애물 거리 — drive_node 초음파 정지 뒤 이보다 멀어지면(1초) 재개
    obstacle_clear_s: 1.0
    sign_retry: 1
    parked_s: 2.0
    map_file: ~/.agv/track_map.json   # 트랙 매핑 저장 (초기 설정 결과)

bt_bridge_node:
  ros__parameters:
    transport: rfcomm           # tcp 로 바꾸면 Wi-Fi/유선으로 노트북 앱 연결 시험 가능 (포트 tcp_port, 영상 +1)
    tcp_port: 9000
    standalone: true            # s0·s1 시험: 브리지가 IDLE·MANUAL·ESTOP 직접 관리 / agv.launch.py는 false로 덮어씀
    video_fps: 5.0
    video_size: [320, 240]
    jpeg_quality: 50
    camera_topic: /camera/image_raw

camera:
  ros__parameters:
    width: 640
    height: 480
