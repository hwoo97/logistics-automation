# 노드 파라미터 — 숫자는 초기값, 테스트 트랙 단계에서 보정 (functional_design.md 10절)
# use_fake_hw 는 launch 인자로 덮어쓴다 (s0_hw.launch.py use_fake_hw:=true)

motor_node:
  ros__parameters:
    duty_max: 0.75              # TT 모터 보호 (7.4V 배터리)
    pwm_hz: 1000
    wheel_map: [front_left, front_right, rear_left, rear_right]   # L1~L4가 어느 바퀴인지 — 2026-10-29 S0 확정
    invert: [true, false, true, false]                            # L1~L4 극성 반전 — 2026-10-29 S0: 양수에서 L1·L3(왼쪽) 뒤로 돎
    turn_gain: 1.0
    watchdog_s: 0.5
    gpio_chip: -1               # -1 = RP1 칩 자동 탐색

pantilt_node:
  ros__parameters:
    pan_channel: 0              # 2026-10-26 확인
    tilt_channel: 1
    settle_s: 0.3
    poses:                      # [팬, 틸트] 도 — 2026-10-29 S0: 팬 65 = 정면, 틸트는 클수록 위 (150 전방 아래, 180 전방)
      LINE: [70, 130]           # 2026-10-30 S1: 라인이 잘 보이는 각도 (사용자)
      JUNCTION: [65, 165]       # 초기값 — 분기점 마커가 보이는 각도로 S5에서 보정
      SIGN: [65, 180]
    i2c_bus: 1
    address: 64                 # 0x40
    oe_pin: 17                  # 제어 없이 동작 확인, 시작 시 LOW만 출력 (-1 = 사용 안 함)
    gpio_chip: -1

ultrasonic_node:
  ros__parameters:
    rate_hz: 15.0
    median_window: 5
    min_range: 0.02
    max_range: 2.0
    trig_pin: 5
    echo_pin: 6
    fake_distance: 1.0
    gpio_chip: -1

led_node:
  ros__parameters:
    red_pin: 16
    green_pin: 26
    gpio_chip: -1

line_node:
  ros__parameters:
    enabled: true
    roi_ratio: 0.33             # 아래쪽 1/3 — 띠 3개(먼·중간·가까운)로 나눔
    black_ratio: 0.72           # 줄의 바닥 밝기(상위 10%)의 이 비율 이하 = 어두움 — 라인을 잃으면 ↑, 바닥 무늬가 잡히면 ↓
    black_v_max: 170            # 이보다 밝으면 라인 아님
    black_blur: 5               # 밝기 중앙값 필터 (홀수)
    black_s_max: 90             # 채도가 이보다 크면 색 마커 → 라인 아님
    min_pixels: 60
    column_fill: 0.4
    edge_ratio: 0.05
    ahead_center_ratio: 0.4
    default_line_px: 20
    angle_min_rows: 15          # 라인 각도를 믿으려면 따라간 줄이 이만큼 필요
    max_line_px: 45            # 한 줄에서 이보다 넓은 검은 구간은 라인 아님 (두꺼운 물체) — 실제 라인 굵기(px) 보고 조정
    center_weight_min: 0.3      # 라인 고르기: 가운데 1.0 → 양끝 0.3 (주변 어두운 물체 대신 가운데 라인)
    prev_weight_min: 0.5        # 직전 라인 위치에서 멀수록 낮춤
    bottom_bonus: 1.5           # 화면 맨 아래(차량 바로 앞)에 닿는 덩어리 가산
    confirm_frames: 3           # S1~S3에서 사진·주행으로 보정
    line_end_frames: 10         # 라인 끝만 더 오래 확인 (잠깐 놓친 것을 끝으로 보지 않게) — 진짜 끝에서 너무 늦게 서면 낮춤

stop_line_node:
  ros__parameters:
    roi_ratio: 0.5              # 아래 1/2 (y120~) — 라인보다 넓게, 일찍 잡아 지나쳐 멈춰도 영역 안
    black_ratio: 0.72           # line_node와 같게
    black_v_max: 170
    black_s_max: 90
    black_blur: 5
    max_line_px: 45
    width_ratio: [3.0, 12.0]    # 정지선 가로 폭 = 라인 굵기의 3~12배 (트랙 규격 4~5배)
    min_thickness: 0.65         # 세로 두께 ≥ 라인 굵기 × 0.65 — 같은 테이프 실측 0.76~0.79배, 얇은 바닥 선 제외
    max_tilt_deg: 35.0          # 이보다 기울면 정지선 아님
    gap_cols: 3                 # 테이프 반사로 이만큼 끊겨도 이어진 것으로 봄
    confirm_frames: 3           # 노트북 앱 "확인 프레임"으로 조정
    hold_frames: 20             # 판정 후 이 프레임 동안 아래로 나가는 정지선도 인정

drive_node:
  ros__parameters:
    rate_hz: 20.0
    speed: 0.6                  # 기본 선속도 (-1~1). TT 모터는 낮으면 바닥에서 안 움직임 — S1에서 보정
    min_speed: 0.45             # 감속해도 이 아래로는 안 내림 (모터 시동 문턱)
    slow_gain: 0.5              # 선속도 = speed × (1 − slow_gain × |오프셋|)
    event_speed: 0.45           # 이벤트 판정이 보이기 시작하면 감속
    kp: 0.8                     # 회전 = −(kp·오프셋 + kd·변화율), 라인이 오른쪽(+)이면 오른쪽으로
    ki: 0.0
    kd: 0.15
    kh: 0.5                     # 라인 각도 보정 비율 (각도 오차 45°일 때 회전 0.5)
    heading_deadband_deg: 5.0   # 85~95°는 각도 보정 안 함
    turn_scale: 1.0             # 회전 세기 (회전량 전체에 곱함) — 앱 "회전 세기", 흔들리면 낮춤
    center_offset: -0.10        # 라인 기준 위치 — 카메라가 차체 중심에서 왼쪽에 달려 화면 가운데에서 10% 왼쪽 (2026-10-30 S1)
    max_angular: 0.6
    line_timeout_s: 0.5         # 라인 상태가 끊기면 정지 (E_LINE)
    recheck_tries: 3            # LINE_END 후 정지해서 라인을 다시 보는 횟수 (0이면 바로 끝)
    recheck_s: 0.5              # 한 번 보는 시간
    recheck_frames: 3           # 이만큼 연속 보이면 자동으로 다시 출발
    verify_clear_frames: 5      # 정지선·코너 판정 후 멈춰서 확인 — 판정이 이만큼 연속 사라지면 다시 출발
    verify_timeout_s: 2.0       # 확정도 사라짐도 없으면 이 시간 뒤 다시 출발
    verify_cooldown_s: 0.5      # 다시 출발 후 이 시간은 판정으로 멈추지 않음

bt_bridge_node:
  ros__parameters:
    transport: rfcomm           # tcp 로 바꾸면 Wi-Fi/유선으로 노트북 앱 연결 시험 가능 (포트 tcp_port, 영상 +1)
    tcp_port: 9000
    standalone: true            # mission_node 작성 전: 브리지가 IDLE·MANUAL·ESTOP 직접 관리
    video_fps: 5.0
    video_size: [320, 240]
    jpeg_quality: 50
    camera_topic: /camera/image_raw

camera:
  ros__parameters:
    width: 640
    height: 480
