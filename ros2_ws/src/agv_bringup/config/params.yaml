# 노드 파라미터 — 숫자는 초기값, 테스트 트랙 단계에서 보정 (functional_design.md 10절)
# use_fake_hw 는 launch 인자로 덮어쓴다 (s0_hw.launch.py use_fake_hw:=true)

motor_node:
  ros__parameters:
    duty_max: 0.75              # TT 모터 보호 (7.4V 배터리)
    pwm_hz: 1000
    wheel_map: [front_left, front_right, rear_left, rear_right]   # L1~L4가 어느 바퀴인지 — 2026-10-29 S0 확정
    invert: [true, false, true, false]                            # L1~L4 극성 반전 — 2026-10-29 S0: 양수에서 L1·L3(왼쪽) 뒤로 돎
    turn_gain: 1.0
    watchdog_s: 0.5
    gpio_chip: -1               # -1 = RP1 칩 자동 탐색

pantilt_node:
  ros__parameters:
    pan_channel: 0              # 2026-10-26 확인
    tilt_channel: 1
    settle_s: 0.3
    poses:                      # [팬, 틸트] 도 — 2026-10-29 S0: 팬 65 = 정면, 틸트는 클수록 위 (150 전방 아래, 180 전방)
      LINE: [65, 150]
      JUNCTION: [65, 165]       # 초기값 — 분기점 마커가 보이는 각도로 S5에서 보정
      SIGN: [65, 180]
    i2c_bus: 1
    address: 64                 # 0x40
    oe_pin: 17                  # 제어 없이 동작 확인, 시작 시 LOW만 출력 (-1 = 사용 안 함)
    gpio_chip: -1

ultrasonic_node:
  ros__parameters:
    rate_hz: 15.0
    median_window: 5
    min_range: 0.02
    max_range: 2.0
    trig_pin: 5
    echo_pin: 6
    fake_distance: 1.0
    gpio_chip: -1

led_node:
  ros__parameters:
    red_pin: 16
    green_pin: 26
    gpio_chip: -1

line_node:
  ros__parameters:
    enabled: true
    roi_ratio: 0.33             # 아래쪽 1/3 — 띠 3개(먼·중간·가까운)로 나눔
    black_v_range: [40, 110]    # 검정 밝기 문턱(Otsu)을 이 범위로 제한
    black_s_max: 90             # 채도가 이보다 크면 색 마커 → 라인 아님
    min_pixels: 60
    column_fill: 0.4
    edge_ratio: 0.05
    stop_line_width_ratio: [2.0, 5.0]
    ahead_center_ratio: 0.4
    default_line_px: 20
    confirm_frames: 3           # S1~S3에서 사진·주행으로 보정

bt_bridge_node:
  ros__parameters:
    transport: rfcomm           # tcp 로 바꾸면 Wi-Fi/유선으로 노트북 앱 연결 시험 가능 (포트 tcp_port, 영상 +1)
    tcp_port: 9000
    standalone: true            # mission_node 작성 전: 브리지가 IDLE·MANUAL·ESTOP 직접 관리
    video_fps: 5.0
    video_size: [320, 240]
    jpeg_quality: 50
    camera_topic: /camera/image_raw

camera:
  ros__parameters:
    width: 640
    height: 480
